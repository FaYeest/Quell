version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: quell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quell
      POSTGRES_PASSWORD: quellpassword
      POSTGRES_DB: quell_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quell -d quell_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quell-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
